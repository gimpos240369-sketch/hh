<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>무한 액자 갤러리</title>
  <style>
    body{
      margin:0; padding:0; overflow:hidden; font-family:Arial; background:#f5f5f5;
    }
    #container{
      position:relative; cursor:grab;
    }
    .frame{
      width:150px; height:150px; background:white; border:2px solid #ccc;
      position:absolute; display:flex; justify-content:center; align-items:center;
      overflow:hidden; border-radius:12px; margin:5px;
    }
    .frame:hover{ border-color:#4ea9ff; }
    .frame img{ width:100%; height:100%; object-fit:cover; border-radius:12px; }
  </style>
</head>
<body>
  <div id="container"></div>
  <input type="file" id="fileInput" accept="image/*" style="display:none" />

  <script>
    const container = document.getElementById('container');
    const fileInput = document.getElementById('fileInput');
    const FRAME_SIZE = 150;
    const GAP = 10;
    let frames = {};
    let currentIndex = null;

    let offsetX=0, offsetY=0;
    let isDragging=false;
    let startX, startY;

    function createFrame(x, y){
      const key = `${x},${y}`;
      if(frames[key]) return;
      const div = document.createElement('div');
      div.className='frame';
      div.style.left = (x*(FRAME_SIZE+GAP))+'px';
      div.style.top = (y*(FRAME_SIZE+GAP))+'px';
      div.dataset.key=key;
      div.addEventListener('click', ()=>{
        currentIndex=key;
        fileInput.click();
      });
      div.innerHTML='<span style="color:#777">클릭</span>';
      container.appendChild(div);
      frames[key]={div, src:null};
    }

    function fillVisible(){
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const startCol = Math.floor(-offsetX/(FRAME_SIZE+GAP))-1;
      const startRow = Math.floor(-offsetY/(FRAME_SIZE+GAP))-1;
      const cols = Math.ceil(vw/(FRAME_SIZE+GAP))+2;
      const rows = Math.ceil(vh/(FRAME_SIZE+GAP))+2;

      for(let r=startRow;r<startRow+rows;r++){
        for(let c=startCol;c<startCol+cols;c++){
          createFrame(c,r);
        }
      }
    }

    function updateContainer(){
      container.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      fillVisible();
    }

    container.addEventListener('mousedown', e=>{
      isDragging=true;
      startX=e.clientX-offsetX;
      startY=e.clientY-offsetY;
      container.style.cursor='grabbing';
    });

    window.addEventListener('mousemove', e=>{
      if(!isDragging) return;
      offsetX=e.clientX-startX;
      offsetY=e.clientY-startY;
      updateContainer();
    });

    window.addEventListener('mouseup', e=>{
      isDragging=false;
      container.style.cursor='grab';
    });

    fileInput.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev =>{
        const frame = frames[currentIndex];
        frame.src = ev.target.result;
        frame.div.innerHTML='';
        const img = document.createElement('img');
        img.src=ev.target.result;
        frame.div.appendChild(img);
      };
      reader.readAsDataURL(file);
      fileInput.value='';
    });

    updateContainer();
    window.addEventListener('resize', fillVisible);
  </script>
</body>
</html>
